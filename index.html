<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>pTerrain</title>
    <script>
      // Apply the stored theme before the first paint, so the page does not flash.
      // The key is THEME_KEY in src/ui/theme.ts.
      try {
        const theme = localStorage.getItem("pterrain-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {
        // Storage is blocked: follow the system.
      }
    </script>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
