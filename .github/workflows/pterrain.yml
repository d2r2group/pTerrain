name: pTerrain

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref at a time; a running deployment is never cut off.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The static checks, unit tests and the build that is deployed, on the bare runner: they need
  # no browser, so they skip the Playwright image and run beside the e2e shards.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/

  # The Playwright tests, split by test across parallel jobs, each building the site itself.
  e2e:
    runs-on: ubuntu-latest
    # Ships Chromium and its system libraries, so no browser download. Keep the tag equal to
    # the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [check, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
